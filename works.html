<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品｜惟瑟 Visser</title>
    <link
        rel="icon"
        type="image/png"
        href="images/favicon.png"
    >
    <link
        rel="apple-touch-icon"
        href="images/logoicon.png"
    > 
    <meta
        name="description"
        content="瀏覽惟瑟 Visser 的原創音樂作品，包含敘事曲、角色曲、塔羅系列、心理雜談等。"
    >
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/works.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <meta property="og:title" content="作品｜惟瑟 Visser">

    <meta
        property="og:description"
        content="探索惟瑟Visser的原創作品、系列與播放清單。"
    >

    <meta
        property="og:image"
        content="https://www.visser6416.com/images/og-image.png"
    >

    <meta
        property="og:url"
        content="https://www.visser6416.com/works.html"
    >

    <meta property="og:type" content="website">

    <meta
        property="og:site_name"
        content="惟瑟 Visser"
    >

    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <meta
        name="twitter:image"
        content="images/og-image"
    >

    <meta
        name="twitter:title"
        content="官網｜惟瑟 Visser"
    >
    <meta
        name="twitter:description"
        content="獨立音樂亂做人｜織思者｜或許勢 Vtuber｜探索原創、存在與邊界的可能性。"
    >

    <meta
        name="twitter:image:alt"
        content="惟瑟 Visser 官方網站"
    >

</head>
<body>
    <header>
        <div id="navbar"></div>
    </header>

    <main class="works_page">
        <section class="works_header">
            <div class="container">
                <p class="section_label">WORKS</p>
                <h1>作品</h1>
                <p class="works_intro">探索惟瑟的音樂、敘事與實驗作品。</p>
            </div>
        </section>

        <section class="works_tools">
            <div class="container works_tools_inner">
                <div class="works_filters" id="works_filters" aria-label="作品分類篩選">
                    <button class="filter_button is_active" type="button" data-filter="全部">
                        全部
                    </button>
                    
                </div>

                <label class="works_search">
                    <span class="sr_only">搜尋作品</span>
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    <input
                        id="works_search_input"
                        type="search"
                        placeholder="搜尋作品名稱、導言或系列"
                        autocomplete="off"
                    >
                </label>
            </div>
        </section>

        <section class="works_status container">
            <p id="works_loading">正在載入作品……</p>
            <p id="works_error" hidden>作品載入失敗，請稍後再試。</p>
            <p id="works_empty" hidden>找不到符合條件的作品。</p>
        </section>

        <section class="works_grid container" id="works_grid" aria-live="polite"></section>
    </main>

    <!-- =====================================
    作品播放器彈窗
    ===================================== -->

    <div
        class="work_modal"
        id="workModal"
        aria-hidden="true"
    >
        <!-- 背景遮罩 -->
        <div
            class="work_modal_backdrop"
            data-close-work-modal
        ></div>

        <!-- 彈窗內容 -->
        <article
            class="work_modal_content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="workModalTitle"
        >
            <!-- 關閉按鈕 -->
            <button
                class="work_modal_close"
                id="workModalClose"
                type="button"
                aria-label="關閉作品播放器"
            >
                <i
                    class="fa-solid fa-xmark"
                    aria-hidden="true"
                ></i>
            </button>

            <div class="work_modal_layout">

                <!-- 左側：播放器與作品資訊 -->
                <section class="work_modal_main">

                    <!-- YouTube 播放器 -->
                    <div class="work_modal_player">
                        <iframe
                            id="workModalIframe"
                            src=""
                            title="YouTube 影片播放器"
                            allow="
                                accelerometer;
                                autoplay;
                                clipboard-write;
                                encrypted-media;
                                gyroscope;
                                picture-in-picture;
                                web-share
                            "
                            allowfullscreen
                        ></iframe>
                    </div>

                    <!-- 作品資訊 -->
                    <div class="work_modal_info">
                        <h2 id="workModalTitle">
                            作品名稱
                        </h2>

                        <div
                            class="work_modal_tags"
                            id="workModalTags"
                        ></div>

                        <p
                            class="work_modal_description"
                            id="workModalDescription"
                        ></p>
                    </div>

                    <!-- 上一部／下一部 -->
                    <nav
                        class="work_modal_navigation"
                        aria-label="作品切換"
                    >
                        <button
                            class="work_modal_previous"
                            id="previousWorkButton"
                            type="button"
                        >
                            <i
                                class="fa-solid fa-arrow-left"
                                aria-hidden="true"
                            ></i>

                            <span>
                                上一部
                            </span>
                        </button>

                        <span
                            class="work_modal_position"
                            id="workModalPosition"
                            aria-live="polite"
                        >
                            1 / 1
                        </span>

                        <button
                            class="work_modal_next"
                            id="nextWorkButton"
                            type="button"
                        >
                            <span>
                                下一部
                            </span>

                            <i
                                class="fa-solid fa-arrow-right"
                                aria-hidden="true"
                            ></i>
                        </button>
                    </nav>
                </section>

                <!-- 右側：歌詞 -->
                <aside
                    class="work_modal_lyrics"
                    aria-labelledby="workModalLyricsTitle"
                >
                    <h3 id="workModalLyricsTitle">
                        歌詞
                    </h3>

                    <div
                        class="work_modal_lyrics_content"
                        id="workModalLyrics"
                    >
                        （無歌詞）
                    </div>
                </aside>

            </div>
        </article>
    </div>

    <footer id="footer"></footer>
    <div
        class="copyright_modal"
        id="copyright_modal"
        aria-hidden="true"
    >
        <div
            class="copyright_dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="copyright_title"
        >
            <button
                class="copyright_close"
                id="copyright_close"
                type="button"
                aria-label="關閉版權資訊"
            >
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>

            <p class="section_label">COPYRIGHT</p>

            <h2 id="copyright_title">
                © 2026 Visser
            </h2>

            <p>
                All Rights Reserved.
            </p>

            <p class="copyright_description">
                本站所有原創音樂、文字、圖片與其他內容，
                除另有標示外，均由 Visser 保留相關權利。
                部分作品可能採用不同授權方式，
                請以各作品的個別說明為準。
            </p>

            <button
                class="copyright_confirm"
                id="copyright_confirm"
                type="button"
            >
                確認
            </button>
        </div>
    </div>
    <button
        id="back_to_top"
        type="button"
        aria-label="回到頂端"
    >
        <i class="fa-solid fa-arrow-up"></i>
    </button>
    <script src="./csstuber/csstuber_component.js" defer></script>
    <script src="js/script.js"></script>
    <script
        type="module"
        src="./js/work.js"
    ></script>
</body>
</html>
