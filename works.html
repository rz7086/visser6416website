<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品｜惟瑟 Visser</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/works.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <header>
        <div id="navbar"></div>
    </header>

    <main class="works_page">
        <section class="works_header">
            <div class="container">
                <p class="section_label">WORKS</p>
                <h1>作品</h1>
                <p class="works_intro">探索惟瑟的音樂、敘事與實驗作品。</p>
            </div>
        </section>

        <section class="works_tools">
            <div class="container works_tools_inner">
                <div class="works_filters" id="works_filters" aria-label="作品分類篩選">
                    <button class="filter_button is_active" type="button" data-filter="all">
                        全部
                    </button>
                    
                </div>

                <label class="works_search">
                    <span class="sr_only">搜尋作品</span>
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    <input
                        id="works_search_input"
                        type="search"
                        placeholder="搜尋作品名稱、導言或系列"
                        autocomplete="off"
                    >
                </label>
            </div>
        </section>

        <section class="works_status container">
            <p id="works_loading">正在載入作品……</p>
            <p id="works_error" hidden>作品載入失敗，請稍後再試。</p>
            <p id="works_empty" hidden>找不到符合條件的作品。</p>
        </section>

        <section class="works_grid container" id="works_grid" aria-live="polite"></section>
    </main>

    <footer id="footer"></footer>
    <div
        class="copyright_modal"
        id="copyright_modal"
        aria-hidden="true"
    >
        <div
            class="copyright_dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="copyright_title"
        >
            <button
                class="copyright_close"
                id="copyright_close"
                type="button"
                aria-label="關閉版權資訊"
            >
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>

            <p class="section_label">COPYRIGHT</p>

            <h2 id="copyright_title">
                © 2026 Visser
            </h2>

            <p>
                All Rights Reserved.
            </p>

            <p class="copyright_description">
                本站所有原創音樂、文字、圖片與其他內容，
                除另有標示外，均由 Visser 保留相關權利。
                部分作品可能採用不同授權方式，
                請以各作品的個別說明為準。
            </p>

            <button
                class="copyright_confirm"
                id="copyright_confirm"
                type="button"
            >
                確認
            </button>
        </div>
    </div>
    <button
        id="back_to_top"
        type="button"
        aria-label="回到頂端"
    >
        <i class="fa-solid fa-arrow-up"></i>
    </button>
    <script src="js/script.js"></script>
    <script src="js/works.js"></script>
</body>
</html>
