<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品｜惟瑟 Visser</title>
    <link
        rel="icon"
        type="image/png"
        href="images/favicon.png"
    >
    <link
        rel="apple-touch-icon"
        href="images/logoicon.png"
    > 
    <meta
        name="description"
        content="瀏覽惟瑟 Visser 的原創音樂作品，包含敘事曲、角色曲、塔羅系列、心理雜談等。"
    >
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/works.css">
    <link rel="stylesheet" href="css/work_player.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <meta property="og:title" content="作品｜惟瑟 Visser">

    <meta
        property="og:description"
        content="探索惟瑟Visser的原創作品、系列與播放清單。"
    >

    <meta
        property="og:image"
        content="https://www.visser6416.com/images/og-image.png"
    >

    <meta
        property="og:url"
        content="https://www.visser6416.com/works.html"
    >

    <meta property="og:type" content="website">

    <meta
        property="og:site_name"
        content="惟瑟 Visser"
    >

    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <meta
        name="twitter:image"
        content="images/og-image"
    >

    <meta
        name="twitter:title"
        content="官網｜惟瑟 Visser"
    >
    <meta
        name="twitter:description"
        content="獨立音樂亂做人｜織思者｜或許勢 Vtuber｜探索原創、存在與邊界的可能性。"
    >

    <meta
        name="twitter:image:alt"
        content="惟瑟 Visser 官方網站"
    >

</head>
<body>
    <header>
        <div id="navbar"></div>
    </header>

    <main class="works_page">
        <section class="works_header">
            <div class="container">
                <p class="section_label">WORKS</p>
                <h1>作品</h1>
                <p class="works_intro">探索惟瑟的音樂、敘事與實驗作品。</p>
            </div>
        </section>

        <section class="works_tools">
            <div class="container works_tools_inner">

                <div
                    id="works_filters"
                    class="works_filters"
                ></div>

                <label class="works_search">
                    <span class="sr_only">
                        搜尋作品
                    </span>

                    <input
                        id="works_search"
                        type="search"
                        placeholder="搜尋作品"
                    >
                </label>

            </div>
        </section>

        <section class="works_status container">

            <p
                id="works_status"
                hidden
            ></p>

            <p id="works_result_count"></p>

        </section>

        <section class="works_grid container" id="works_grid" aria-live="polite"></section>
    </main>

    <!-- =====================================
    作品播放器彈窗
    ===================================== -->

    <div
        id="work_modal"
        class="work_modal"
        aria-hidden="true"
    >
        <div
            class="work_modal_backdrop"
            data-work-modal-close
        ></div>

        <div id="work_modal_mount"></div>
    </div>


    <footer id="footer"></footer>
    <div
        class="copyright_modal"
        id="copyright_modal"
        aria-hidden="true"
    >
        <div
            class="copyright_dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="copyright_title"
        >
            <button
                class="copyright_close"
                id="copyright_close"
                type="button"
                aria-label="關閉版權資訊"
            >
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>

            <p class="section_label">COPYRIGHT</p>

            <h2 id="copyright_title">
                © 2026 Visser
            </h2>

            <p>
                All Rights Reserved.
            </p>

            <p class="copyright_description">
                本站所有原創音樂、文字、圖片與其他內容，
                除另有標示外，均由 Visser 保留相關權利。
                部分作品可能採用不同授權方式，
                請以各作品的個別說明為準。
            </p>

            <button
                class="copyright_confirm"
                id="copyright_confirm"
                type="button"
            >
                確認
            </button>
        </div>
    </div>
    <button
        id="back_to_top"
        type="button"
        aria-label="回到頂端"
    >
        <i class="fa-solid fa-arrow-up"></i>
    </button>
    <script src="./csstuber/csstuber_component.js" defer></script>
    <script src="js/script.js"></script>
    <script src="/js/work_player.js"></script>
    <script
        type="module"
        src="/js/works.js"
    ></script>
</body>
</html>
