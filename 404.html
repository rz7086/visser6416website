<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        404｜惟瑟 Visser
    </title>

    <link
        rel="icon"
        type="image/png"
        href="images/favicon.png"
    >

    <link
        rel="apple-touch-icon"
        href="images/logoicon.png"
    >

    <meta
        name="robots"
        content="noindex"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >
    <link
        rel="stylesheet"
        href="css/404.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
</head>

<body>

    <header>
        <div id="navbar"></div>
    </header>

    <main class="error_page">

        <section class="error_container">

            <h1>
                404
            </h1>

            <p>
                你是不是試圖穿越異世界？
            </p>

            <a
                class="button"
                href="index.html"
            >
                回首頁
            </a>

        </section>

    </main>

    <footer id="footer"></footer>
    <div
        class="copyright_modal"
        id="copyright_modal"
        aria-hidden="true"
    >
        <div
            class="copyright_dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="copyright_title"
        >
            <button
                class="copyright_close"
                id="copyright_close"
                type="button"
                aria-label="關閉版權資訊"
            >
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>

            <p class="section_label">COPYRIGHT</p>

            <h2 id="copyright_title">
                © 2026 Visser
            </h2>

            <p>
                All Rights Reserved.
            </p>

            <p class="copyright_description">
                本站所有原創音樂、文字、圖片與其他內容，
                除另有標示外，均由 Visser 保留相關權利。
                部分作品可能採用不同授權方式，
                請以各作品的個別說明為準。
            </p>

            <button
                class="copyright_confirm"
                id="copyright_confirm"
                type="button"
            >
                確認
            </button>
        </div>
    </div>

    <button
        id="back_to_top"
        type="button"
        aria-label="回到頂端"
    >
        <i class="fa-solid fa-arrow-up"></i>
    </button>

    <script
        src="./csstuber/csstuber_component.js"
        defer
    ></script>

    <script src="js/script.js"></script>

</body>

</html>
